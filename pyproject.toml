[project]
dependencies = [
    "uvloop>=0.21.0; sys_platform == 'darwin' or sys_platform == 'linux'",
    'tgcrypto-gmanka',
    'kurigram',
    'tortoise-orm',
    'rich',
]
name = 'reposter'
version = '26.0.1'
description = 'userbot that forwards messages from telegram channels to others in real time'
readme = 'readme.md'
requires-python = '>=3.11'
license = 'AGPL-3.0-only'
[project.urls]
repo = 'https://github.com/gmankab/reposter'

[project.optional-dependencies]
tests = [
    'pyright',
    'ruff',
]
build = [
    'setuptools',
    'twine',
    'build',
]

[project.scripts]
reposter = 'reposter.__main__:main'

[tool.pyright]
venvPath = '.'
venv = '.venv'

[tool.setuptools.packages.find]
where = ['.']

